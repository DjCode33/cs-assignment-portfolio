<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Academic Assignment Portfolio</title>
    <!-- We load the huge core framework engines directly from the public web library -->
    <script src="https://cloudflare.com"></script>
    <script src="uv/uv.config.js" defer></script>
    <script>
        async function launchSecureSession(e) {
            e.preventDefault();
            const input = document.getElementById('target-url').value;
            if (!input) return;
            
            try {
                // Register the worker right from your main folder scope
                await navigator.serviceWorker.register('uv.sw.js', {
                    scope: 'service/'
                });
                
                let target = input.trim();
                if (!/^https?:\/\//i.test(target)) target = 'https://' + target;
                
                window.location.href = 'service/' + __uv$config.encodeUrl(target);
            } catch(err) {
                alert('Portal routing failure: ' + err.message);
            }
        }
    </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 100px; background: #0b0f19; color: #fff;">
    <h2>📂 Personal Academic Workspace</h2>
    <p style="color: #64748b;">Secure request sandbox compiled entirely via remote cloud-delivery routing networks:</p>
    <form onsubmit="launchSecureSession(event)" style="margin-top: 25px;">
        <input type="text" id="target-url" placeholder="://discord.com" style="width: 420px; padding: 12px; border-radius: 6px; border: 1px solid #1e293b; background: #0f172a; color: #fff;" required />
        <button type="submit" style="padding: 12px 22px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-left: 10px;">Connect</button>
    </form>
</body>
</html>
