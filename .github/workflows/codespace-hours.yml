name: Codespace hours

on:
  schedule:
    - cron: "5 13 * * 1-5" # 8:05 AM CDT: start
    - cron: "5 14 * * 1-5" # 8:05 AM CST: start
    - cron: "5 16 * * 1-5" # 11:05 AM CDT: stop
    - cron: "5 17 * * 1-5" # Noon CDT start / 11:05 AM CST stop
    - cron: "5 18 * * 1-5" # Noon:05 PM CST: start
    - cron: "5 20 * * 1-5" # 3:05 PM CDT: stop
    - cron: "5 21 * * 1-5" # 3:05 PM CST: stop
  workflow_dispatch:

jobs:
  manage-codespace:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
      CODESPACE_NAME: friendly-adventure-6vrjvvwpjrgph9gx
      SCHEDULE_CRON: ${{ github.event.schedule }}
    steps:
      - name: Select scheduled action
        id: schedule
        if: github.event_name == 'schedule'
        run: |
          zone="$(TZ=America/Chicago date +'%Z')"
          case "$SCHEDULE_CRON:$zone" in
            '5 13 * * 1-5:CDT'|'5 17 * * 1-5:CDT'|'5 14 * * 1-5:CST'|'5 18 * * 1-5:CST')
              echo "action=start" >> "$GITHUB_OUTPUT" ;;
            '5 16 * * 1-5:CDT'|'5 17 * * 1-5:CST'|'5 20 * * 1-5:CDT'|'5 21 * * 1-5:CST')
              echo "action=stop" >> "$GITHUB_OUTPUT" ;;
            *) echo "action=skip" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Start Codespace
        if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.action == 'start'
        run: gh api --method POST "/user/codespaces/${CODESPACE_NAME}/start"

      - name: Wait for Codespace
        if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.action == 'start'
        run: |
          for attempt in {1..40}; do
            state="$(gh api "/user/codespaces/${CODESPACE_NAME}" --jq '.state')"
            echo "Codespace state: $state"
            if [ "$state" = "Available" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Codespace did not become available after 10 minutes."
          exit 1

      - name: Connect to Codespace and start app
        if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.action == 'start'
        run: |
          gh codespace ssh --codespace "$CODESPACE_NAME" -- \
            'cd /workspaces/cs-assignment-portfolio && if ! pgrep -f "[n]ode src/index.js" >/dev/null; then nohup env PORT=8081 npm start >/tmp/codespace-proxy.log 2>&1 </dev/null & fi && for attempt in {1..30}; do if curl --fail --silent http://127.0.0.1:8081/api/proxy-usage >/dev/null; then exit 0; fi; sleep 2; done; echo "App did not respond on port 8081; server log follows:"; cat /tmp/codespace-proxy.log; exit 1'

      - name: Make proxy port public
        if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.action == 'start'
        run: |
          for attempt in {1..6}; do
            if gh codespace ports visibility 8081:public --codespace "$CODESPACE_NAME"; then
              exit 0
            fi
            echo "Port publication attempt $attempt failed; retrying in 5 seconds."
            sleep 5
          done
          echo "Could not make proxy port 8081 public."
          exit 1

      - name: Stop Codespace
        if: steps.schedule.outputs.action == 'stop'
        run: gh api --method POST "/user/codespaces/${CODESPACE_NAME}/stop"
