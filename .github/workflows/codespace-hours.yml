name: Codespace hours

on:
  schedule:
    - cron: "0 13 * * 1-5" # 8 AM CDT: start
    - cron: "0 16 * * 1-5" # 11 AM CDT: stop
    - cron: "0 17 * * 1-5" # 12 PM CDT: start
    - cron: "0 20 * * 1-5" # 3 PM CDT: stop

jobs:
  manage-codespace:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
      CODESPACE_NAME: effective-journey-jr4xrr9gxrjjfqjv
    steps:
      - name: Start Codespace
        if: github.event.schedule == '0 13 * * 1-5' || github.event.schedule == '0 17 * * 1-5'
        run: gh api --method POST "/user/codespaces/${CODESPACE_NAME}/start"

      - name: Wait for Codespace and start app
        if: github.event.schedule == '0 13 * * 1-5' || github.event.schedule == '0 17 * * 1-5'
        run: |
          for attempt in {1..60}; do
            state="$(gh api "/user/codespaces/${CODESPACE_NAME}" --jq '.state')"
            if [[ "$state" == "Available" ]]; then
              break
            fi
            echo "Codespace state: $state; waiting for it to start."
            sleep 10
          done

          if [[ "$state" != "Available" ]]; then
            echo "Codespace did not become available in time."
            exit 1
          fi

          gh codespace ssh --codespace "$CODESPACE_NAME" -- bash -lc \
            'cd /workspaces/cs-assignment-portfolio && if ! pgrep -f "[n]ode src/index.js" >/dev/null; then nohup env PORT=8081 npm start >/tmp/codespace-proxy.log 2>&1 </dev/null & fi'

      - name: Stop Codespace
        if: github.event.schedule == '0 16 * * 1-5' || github.event.schedule == '0 20 * * 1-5'
        run: gh api --method POST "/user/codespaces/${CODESPACE_NAME}/stop"
